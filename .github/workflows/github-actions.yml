name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
      full-test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
            with:
              clean: true
              fetch-depth: 0
              submodules: 'recursive'
          - uses: webfactory/ssh-agent@v0.5.4
            with:
                 ssh-private-key: ${{ secrets.ASSIGNMENT_8_AESDCHAR_YOCTO }}
          - name: Run build
            timeout-minutes: 600
            run: |
              # 1. Create the Yocto cache folders on the cloud runner host
              mkdir -p ~/yocto-cache/downloads
              mkdir -p ~/yocto-cache/sstate-cache

              # 2. Use ubuntu-latest's native curl to pull down files to the host
              curl -L https://github.com -o lz4.tar.gz
              curl -L https://github.com -o zstd.tar.gz
              
              # 3. Spin up the container, passing the downloaded archives inside to compile them
              docker run --rm \
                -v $SSH_AUTH_SOCK:/ssh-agent \
                -e SSH_AUTH_SOCK=/ssh-agent \
                -e GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
                -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} \
                -v ~/yocto-cache/downloads:/yocto-cache/downloads \
                -v ~/yocto-cache/sstate-cache:/yocto-cache/sstate-cache \
                -e BB_ENV_PASSTHROUGH_ADDITIONS="DL_DIR SSTATE_DIR INHERIT" \
                -e DL_DIR="/yocto-cache/downloads" \
                -e SSTATE_DIR="/yocto-cache/sstate-cache" \
                -e INHERIT="rm_work" \
                --workdir=${GITHUB_WORKSPACE} \
                cuaesd/aesd-autotest:assignment8-yocto \
                /bin/bash -c "
                  tar -xzf lz4.tar.gz && cd lz4-v1.9.4 && make -j\$(nproc) && sudo make install && cd .. && rm -rf lz4* &&
                  tar -xzf zstd.tar.gz && cd zstd-1.5.5 && make -j\$(nproc) && sudo make install && cd .. && rm -rf zstd* &&
                  ./build.sh
                  "
          - name: Cleanup
            if: always()
            run: |
              ssh-add -D
          - name: Run full test
            timeout-minutes: 15
            run: |
               docker run --rm \
                 -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} \
                 cuaesd/aesd-autotest:assignment8-yocto \
                 --workdir=${GITHUB_WORKSPACE} \
                 ./full-test.sh
