name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
      full-test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
            with:
              clean: true
              fetch-depth: 0
              submodules: 'recursive'
          - uses: webfactory/ssh-agent@v0.5.4
            with:
                 ssh-private-key: ${{ secrets.ASSIGNMENT_8_AESDCHAR_YOCTO }}
          - name: Run build
            timeout-minutes: 600
            run: |
               # 1. Mount host directories inside the docker container \ 
               # 2. Tell BitBake to override DL_DIR and SSTATE_DIR with these paths \
               docker run --rm \
                 -v $SSH_AUTH_SOCK:/ssh-agent -e SSH_AUTH_SOCK=/ssh-agent \
                 -e GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
                 -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} \
                 -v ~/git/assignment-8-yocto/build/downloads:/yocto-cache/downloads \
                 -v ~/git/assignment-8-yocto/build/sstate-cache:/yocto-cache/sstate-cache \
                 -e BB_ENV_PASSTHROUGH_ADDITIONS="DL_DIR SSTATE_DIR" \
                 -e DL_DIR="/yocto-cache/downloads" \
                 -e SSTATE_DIR="/yocto-cache/sstate-cache" \
                 -e INHERIT="rm_work" \
                 \
                 --workdir=${GITHUB_WORKSPACE} \
                 cuaesd/aesd-autotest:assignment8-yocto \
                 \
                 bin/bash -c "apt-get update && apt-get install -y lz4 zstd && ./build.sh"
          - name: Cleanup
            if: always()
            run: |
              ssh-add -D
          - name: Run full test
            timeout-minutes: 15
            run: |
               docker run --rm \
                 -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} \
                 cuaesd/aesd-autotest:assignment8-yocto \
                 --workdir=${GITHUB_WORKSPACE} \
                 ./full-test.sh
